services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/dbdata/hackathon.db
      DEBUG: "false"
      # Демо без реальных агентов: держит базу свежей. В бою — false.
      DEMO_FEED: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-vko-2026}
      GENAI_TOKEN: ${GENAI_TOKEN:-}
    volumes:
      - db:/app/dbdata
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      # Адрес, по которому бэкенд доступен из браузера. Для чужого хоста:
      # VITE_API_URL=http://<host>:8000 docker compose build frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"

volumes:
  db:
